{
  "lowMemoryMode": true,

  "listen": {
    "ip": "any",
    "port": 9118,
    "scheme": "http",
    "version": true,
    "ResponseCancelAfter": 15
  },

  "BaseModule": {
    "SkipModules": [
      "Catalog",
      "DLNA",
      "JacRed",
      "Sync",
      "TimeCode",
      "TorrServer",
      "Tracks",
      "Transcoding",
      "WebLog",
      "LampaWeb",
      "TmdbProxy",
      "CubProxy",
      "Corseu",
      "CorsMedia"
    ],

    "LoadModules": [
      "Online",
      "OnlineRUS",
      "ProxyLimiter"
    ],

    "ValidateRequest": false,
    "BlockedBots": false
  },

  "chromium": {
    "enable": false
  },

  "firefox": {
    "enable": false
  },

  "rch": {
    "enable": false,
    "requiredConnected": 1
  },

  "GC": {
    "Concurrent": true,
    "ConserveMemory": 2,
    "HighMemoryPercent": 80,
    "RetainVM": false
  },

  "serilog": false
}
